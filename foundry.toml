[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true

fuzz = { runs = 256 }

[profile.ci]
gas_snapshot_check = true

# Pin the fuzz seed in CI so the gas snapshot is stable across runs.
# Locally we let fuzz pick a random seed for broader exploration.
[profile.ci.fuzz]
runs = 256
seed = "0x1"


[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "long"

[rpc_endpoints]
bittensor = "${BITTENSOR_RPC_URL}"
bittensor_testnet = "${BITTENSOR_TESTNET_RPC_URL}"

[etherscan.bittensor]
chain = 8299
url = "https://evm.taostats.io/api/"
key = "${BITTENSOR_API_KEY}"

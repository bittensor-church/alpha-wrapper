name: CI

permissions:
  contents: read

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.0

      - name: Cache forge artifacts
        uses: actions/cache@v4
        with:
          path: |
            out
            cache
          key: forge-${{ runner.os }}-ci-${{ hashFiles('foundry.toml', 'src/**/*.sol', 'test/**/*.sol', 'lib/**') }}
          restore-keys: forge-${{ runner.os }}-ci-

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          forge build --sizes | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Run tests and check gas snapshot
        run: forge snapshot --check --tolerance 1 -vvv

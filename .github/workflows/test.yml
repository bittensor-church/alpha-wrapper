name: CI

permissions:
  contents: read

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

env:
  FOUNDRY_PROFILE: ci
  FOUNDRY_GAS_SNAPSHOT_CHECK: false
  FOUNDRY_GAS_SNAPSHOT_EMIT: true

jobs:
  check:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Cache forge artifacts
        uses: actions/cache@v6
        with:
          path: |
            out
            cache
          key: forge-${{ runner.os }}-ci-${{ hashFiles('foundry.toml', 'src/**/*.sol', 'test/**/*.sol', 'lib/**') }}
          restore-keys: forge-${{ runner.os }}-ci-

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        # pipefail so an over-EIP-170 contract fails the step here; without it `tee` returns 0
        # and the oversize only surfaces later as a failed deployment.
        run: |
          set -o pipefail
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          forge build --sizes | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Run tests and regenerate gas snapshot
        # Snapshot deterministic cases; sampled fuzz/invariant gas varies with the inputs.
        # Both randomized suites still run in their dedicated steps below.
        run: forge snapshot --no-match-contract Invariant --no-match-test testFuzz --threads 4 -vvv

      - name: Upload regenerated gas snapshots
        uses: actions/upload-artifact@v4
        with:
          name: recovery-dust-gas-snapshots
          include-hidden-files: true
          path: |
            .gas-snapshot
            snapshots/

      - name: Run fuzz tests
        run: forge test --match-test testFuzz --no-match-contract Invariant -vvv

      - name: Run invariant tests
        run: forge test --match-contract Invariant -vvv

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: E2E helper unit tests (no chain)
        run: python -m pytest e2e/tests -v -m "not scenario"

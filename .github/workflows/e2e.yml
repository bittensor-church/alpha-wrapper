name: E2E Tests

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

env:
  FOUNDRY_PROFILE: ci

jobs:
  e2e:
    name: Localnet E2E (${{ matrix.script }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        # Each leg gets its own fresh subtensor service container, so the
        # transfers-off run (which globally disables alpha transfers) is isolated.
        script:
          - localnet-e2e.sh
          - localnet-e2e-transfers-off.sh

    services:
      subtensor:
        image: ghcr.io/opentensor/subtensor-localnet:main
        ports:
          - 9944:9944
          - 9945:9945

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.0

      - name: Cache forge artifacts
        uses: actions/cache@v5
        with:
          path: |
            out
            cache
          key: forge-${{ runner.os }}-ci-${{ hashFiles('foundry.toml', 'src/**/*.sol', 'test/**/*.sol', 'lib/**') }}
          restore-keys: forge-${{ runner.os }}-ci-

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          pip install bittensor-cli==9.23.1 substrate-interface
          pip install -r requirements.txt
          # btcli 9.23.1 ships `cyscale`, a compiled drop-in that occupies the `scalecodec`
          # namespace also pulled in (pure-python) by substrate-interface. With both present
          # the pure files shadow cyscale's .so and btcli aborts on import. Remove both, then
          # reinstall cyscale alone so it owns the namespace cleanly (maintainer's documented fix).
          pip uninstall -y scalecodec cyscale
          pip install -U cyscale --force-reinstall

      - name: Compile-check Python scripts
        run: python -m py_compile scripts/*.py

      - name: Wait for subtensor to be ready
        run: |
          echo "Waiting for subtensor localnet..."
          for i in $(seq 1 30); do
            if cast chain-id --rpc-url http://127.0.0.1:9944 2>/dev/null; then
              echo "Subtensor is ready!"
              exit 0
            fi
            echo "  attempt $i/30..."
            sleep 2
          done
          echo "Subtensor failed to start"
          exit 1

      - name: Run E2E test
        run: |
          chmod +x scripts/${{ matrix.script }}
          ./scripts/${{ matrix.script }}

      - name: Collect subtensor logs
        if: failure()
        run: docker logs subtensor 2>&1 | tail -100 || true

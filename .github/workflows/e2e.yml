name: E2E Tests

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

env:
  FOUNDRY_PROFILE: ci

jobs:
  e2e:
    name: Localnet E2E (${{ matrix.script }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        # Each leg gets its own fresh subtensor service container, so the
        # transfers-off run (which globally disables alpha transfers) is isolated.
        script:
          - localnet-e2e.sh
          - localnet-e2e-transfers-off.sh
          - localnet-e2e-convicted-alpha.sh
          - localnet-e2e-subnet-dissolved.sh
          - localnet-e2e-min-stake-floor.sh
          - localnet-e2e-dust-dos.sh
          - localnet-e2e-hostile-dust.sh
          - localnet-e2e-min-stake-liveness.sh

    services:
      subtensor:
        # The opentensor namespace is frozen at spec 424, which predates isSubnetDissolving;
        # the dissolution legs need the RaoFoundation package (spec 431+) to run at all.
        # Pinned by digest: devnet is a moving target; bump deliberately.
        image: ghcr.io/raofoundation/subtensor-localnet:devnet@sha256:6efc6cd88dbaad7012e3bb8872da785ed6ce9a5e6610647889b2ba4fc26f7bcb
        ports:
          - 9944:9944
          - 9945:9945

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.0

      - name: Cache forge artifacts
        uses: actions/cache@v5
        with:
          path: |
            out
            cache
          key: forge-${{ runner.os }}-ci-${{ hashFiles('foundry.toml', 'src/**/*.sol', 'test/**/*.sol', 'lib/**') }}
          restore-keys: forge-${{ runner.os }}-ci-

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          pip install bittensor-cli==9.23.2 substrate-interface
          pip install -r requirements.txt
          # cyscale and py-scale-codec both claim the `scalecodec` namespace: the CLI pulls
          # cyscale, substrate-interface pulls py-scale-codec, and whichever lands second
          # breaks the other's import. cyscale is a drop-in replacement for py-scale-codec,
          # so install it last and let it serve both.
          pip uninstall -y scalecodec cyscale
          pip install cyscale==0.5.0

      - name: Compile-check Python scripts
        run: python -m py_compile scripts/*.py e2e/*.py

      - name: Wait for subtensor to be ready
        run: |
          echo "Waiting for subtensor localnet..."
          for i in $(seq 1 30); do
            if cast chain-id --rpc-url http://127.0.0.1:9944 2>/dev/null; then
              echo "Subtensor is ready!"
              exit 0
            fi
            echo "  attempt $i/30..."
            sleep 2
          done
          echo "Subtensor failed to start"
          exit 1

      - name: Run E2E test
        run: |
          chmod +x e2e/${{ matrix.script }}
          ./e2e/${{ matrix.script }}

      - name: Collect subtensor logs
        if: failure()
        run: docker logs subtensor 2>&1 | tail -100 || true

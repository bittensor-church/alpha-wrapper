name: E2E Tests

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

env:
  FOUNDRY_PROFILE: ci

jobs:
  e2e:
    name: Localnet E2E (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        # Each scenario gets its own fresh subtensor service container, so the
        # transfers-off run (which globally disables alpha transfers) is isolated.
        scenario:
          - tests/test_full_flow.py
          - tests/test_transfers_off.py
          - tests/test_convicted_alpha.py
          - tests/test_subnet_dissolved.py
          - tests/test_min_stake_floor.py
          - tests/test_dust_dos.py
          - tests/test_hostile_dust.py
          - tests/test_min_stake_liveness.py
          - tests/test_claimable_tao.py
          - tests/test_parked_stake.py

    services:
      subtensor:
        # The opentensor namespace is frozen at spec 424: the dissolution legs need the
        # RaoFoundation package (431+ for isSubnetDissolving) and the vault's chain-read
        # min stake needs 438+ for getDefaultMinStake.
        # Pinned by digest: devnet is a moving target; bump deliberately.
        image: ghcr.io/raofoundation/subtensor-localnet:devnet@sha256:f68b9a1744401fca244a25ec579f461926944c6addac252a89af88a9e9271510
        ports:
          - 9944:9944
          - 9945:9945

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Cache forge artifacts
        uses: actions/cache@v6
        with:
          path: |
            out
            cache
          key: forge-${{ runner.os }}-ci-${{ hashFiles('foundry.toml', 'src/**/*.sol', 'test/**/*.sol', 'lib/**') }}
          restore-keys: forge-${{ runner.os }}-ci-

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: e2e/install-deps.sh

      - name: Compile-check Python scripts
        run: python -m py_compile scripts/*.py e2e/*.py e2e/alpha_e2e/*.py e2e/tests/*.py

      - name: Wait for subtensor to be ready
        run: |
          echo "Waiting for subtensor localnet..."
          for i in $(seq 1 30); do
            if cast chain-id --rpc-url http://127.0.0.1:9944 2>/dev/null; then
              echo "Subtensor is ready!"
              exit 0
            fi
            echo "  attempt $i/30..."
            sleep 2
          done
          echo "Subtensor failed to start"
          exit 1

      - name: Run E2E test
        working-directory: e2e
        run: python -m pytest ${{ matrix.scenario }} -v -m scenario --tb=short

      - name: Collect subtensor logs
        if: failure()
        # The service key is only a network alias; docker knows the container by
        # its runner-generated id.
        run: docker logs "${{ job.services.subtensor.id }}" 2>&1 | tail -100 || true

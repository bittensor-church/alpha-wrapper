name: E2E Tests

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

env:
  FOUNDRY_PROFILE: ci

jobs:
  e2e:
    name: Localnet E2E (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        # Each scenario gets its own fresh subtensor service container, so the
        # transfers-off run (which globally disables alpha transfers) is isolated.
        scenario:
          - tests/test_environment_builds.py
          - tests/test_full_flow.py
          - tests/test_transfers_off.py
          - tests/test_convicted_alpha.py
          - tests/test_subnet_dissolved.py
          - tests/test_min_stake_floor.py
          - tests/test_dust_dos.py
          - tests/test_hostile_dust.py
          - tests/test_min_stake_liveness.py

    services:
      subtensor:
        # Pinned: :main is a moving target; bump deliberately.
        image: ghcr.io/opentensor/subtensor-localnet:v3.4.9-424
        ports:
          - 9944:9944
          - 9945:9945

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.0

      - name: Cache forge artifacts
        uses: actions/cache@v5
        with:
          path: |
            out
            cache
          key: forge-${{ runner.os }}-ci-${{ hashFiles('foundry.toml', 'src/**/*.sol', 'test/**/*.sol', 'lib/**') }}
          restore-keys: forge-${{ runner.os }}-ci-

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install -r e2e/requirements.txt

      - name: Compile-check Python scripts
        run: python -m py_compile scripts/*.py e2e/*.py e2e/alpha_e2e/*.py e2e/tests/*.py

      - name: Wait for subtensor to be ready
        run: |
          echo "Waiting for subtensor localnet..."
          for i in $(seq 1 30); do
            if cast chain-id --rpc-url http://127.0.0.1:9944 2>/dev/null; then
              echo "Subtensor is ready!"
              exit 0
            fi
            echo "  attempt $i/30..."
            sleep 2
          done
          echo "Subtensor failed to start"
          exit 1

      - name: Run E2E test
        working-directory: e2e
        run: python -m pytest ${{ matrix.scenario }} -v -m scenario --tb=short

      - name: Collect subtensor logs
        if: failure()
        run: docker logs subtensor 2>&1 | tail -100 || true
